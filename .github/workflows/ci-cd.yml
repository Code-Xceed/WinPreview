name: Production CI/CD & Automated Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Build, Verify & Package (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up LLVM-MinGW toolchain
        shell: pwsh
        run: |
          Write-Host "Querying latest LLVM-MinGW release..."
          $headers = @{ "User-Agent" = "GitHub-Actions-CI" }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/mstorsjo/llvm-mingw/releases/latest" -Headers $headers
          $asset = $release.assets | Where-Object { $_.name -like "*ucrt-x86_64.zip" } | Select-Object -First 1
          if (-not $asset) { throw "No LLVM-MinGW UCRT x86_64 asset found in latest release." }
          Write-Host "Downloading $($asset.name)..."
          $zipPath = "$env:RUNNER_TEMP\llvm-mingw.zip"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath "$env:RUNNER_TEMP\llvm-mingw"
          $dir = Get-ChildItem "$env:RUNNER_TEMP\llvm-mingw" | Where-Object { $_.PSIsContainer } | Select-Object -First 1
          $binDir = Join-Path $dir.FullName "bin"
          $binDir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & (Join-Path $binDir "clang++.exe") --version
          Write-Host "Added LLVM-MinGW to PATH: $binDir" -ForegroundColor Green

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile, verify & package
        shell: powershell
        env:
          WINPREVIEW_UPDATE_KEY: ${{ secrets.WINPREVIEW_UPDATE_KEY }}
        run: |
          powershell -ExecutionPolicy Bypass -File publish.ps1 -NoLaunch
          if ($LASTEXITCODE -ne 0) { throw "publish.ps1 failed with exit code $LASTEXITCODE" }

      - name: Verify signed update manifest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          if (-not (Test-Path dist/Installer/version.json.sig)) {
            Write-Host "::error::Refusing to publish an unsigned release. Add the repository secret WINPREVIEW_UPDATE_KEY (see tools/update-keygen.ps1)."
            exit 1
          }
          $sig = (Get-Content dist/Installer/version.json.sig -Raw).Trim()
          if ($sig.Length -lt 80) { throw "Signature file looks truncated." }
          Write-Host "Signed manifest present ($($sig.Length) base64 chars)."

      - name: Runtime smoke test (update self-test + render)
        shell: pwsh
        run: |
          $exe = "dist/WinPreview/WinPreview.exe"
          if (-not (Test-Path $exe)) { throw "staged exe missing" }

          # Signing key + manifest parser, offline.
          $selftest = Start-Process -FilePath $exe -ArgumentList "--selftest-update" -Wait -PassThru
          $archiveSelfTest = Start-Process -FilePath $exe -ArgumentList "--selftest-archive" -Wait -PassThru
          if ($archiveSelfTest.ExitCode -ne 0) { throw "archive self-test failed ($($archiveSelfTest.ExitCode))" }
          Write-Host "archive self-test: ok"
          if ($selftest.ExitCode -ne 0) { throw "update self-test failed ($($selftest.ExitCode))" }
          Write-Host "update self-test: ok"

          # Real Direct2D render of a generated sample (no dev fixtures needed).
          Add-Type -AssemblyName System.Drawing
          $png = Join-Path $env:RUNNER_TEMP "smoke.png"
          $bmp = New-Object System.Drawing.Bitmap 320, 200
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.Clear([System.Drawing.Color]::FromArgb(20, 24, 32))
          $g.DrawString("smoke", (New-Object System.Drawing.Font("Segoe UI", 24)), [System.Drawing.Brushes]::White, 12, 12)
          $g.Dispose(); $bmp.Save($png, [System.Drawing.Imaging.ImageFormat]::Png); $bmp.Dispose()

          $shot = Join-Path $env:RUNNER_TEMP "render.png"
          $p = Start-Process -FilePath $exe -ArgumentList @("`"$png`"", "--screenshot", "`"$shot`"", "--width", "900", "--height", "600") -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path $shot)) { throw "render smoke test produced no screenshot" }
          if ((Get-Item $shot).Length -lt 5000) { throw "render smoke screenshot looks empty" }
          Write-Host "render smoke: ok ($((Get-Item $shot).Length) bytes)"

      - name: Verify generated files are committed
        shell: pwsh
        run: |
          # publish.ps1 derives version.h and the installer from version.json.
          # If this produces a diff, the release was built from stale generated files.
          git diff --exit-code -- src/version.h installer/WinPreview.iss
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::src/version.h or installer/WinPreview.iss is out of sync with version.json. Run publish.ps1 locally and commit the result."
            exit 1
          }

      - name: Show artifact checksums
        shell: pwsh
        run: |
          Get-ChildItem dist\Installer | Select-Object Name, Length, LastWriteTime | Format-Table -AutoSize
          Get-FileHash dist\Installer\WinPreview-Setup-x64.exe -Algorithm SHA256 | Format-List
          Get-FileHash dist\Installer\WinPreview-Portable-x64.zip -Algorithm SHA256 | Format-List

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WinPreview-Windows-x64
          path: |
            dist/Installer/WinPreview-Setup-x64.exe
            dist/Installer/WinPreview-Portable-x64.zip
            dist/Installer/version.json
            dist/Installer/version.json.sig
            version.json
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build-and-verify
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@v4
        with:
          name: WinPreview-Windows-x64
          path: release-assets

      - name: Determine release tag
        id: meta
        shell: pwsh
        run: |
          $manifest = Get-Content "release-assets/dist/Installer/version.json" -Raw | ConvertFrom-Json
          if (-not $manifest.version) { throw "Release manifest is missing a version." }
          "tag=v$($manifest.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Tag pushes keep their existing tag; manual releases use v<version.json>.
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.meta.outputs.tag }}
          files: |
            release-assets/dist/Installer/WinPreview-Setup-x64.exe
            release-assets/dist/Installer/WinPreview-Portable-x64.zip
            release-assets/dist/Installer/version.json
            release-assets/dist/Installer/version.json.sig
          draft: false
          prerelease: false
          generate_release_notes: true
