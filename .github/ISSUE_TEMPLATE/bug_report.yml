name: 🐛 Bug Report
description: Create a report to help us improve WinPreview
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible.
  - type: input
    id: version
    attributes:
      label: WinPreview Version
      description: What version or commit of WinPreview are you running? (e.g., v1.0.0)
      placeholder: v1.0.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows Version & Architecture
      description: e.g. Windows 11 Pro 23H2 (x64)
      placeholder: Windows 11 Build 22631 (x64)
    validations:
      required: true
  - type: input
    id: file-type
    attributes:
      label: File Type / Extension Being Previewed
      description: What file format triggered the issue? (e.g. .pdf, .png, .mp4, .ts, etc.)
      placeholder: .pdf
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Explain the steps to reproduce the bug.
      placeholder: |
        1. Select file 'document.pdf' in File Explorer
        2. Press Spacebar
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: logs-screenshots
    attributes:
      label: Logs / Screenshots
      description: Attach screenshots or logs if applicable.
