<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <radialGradient id="orbGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0" />
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Stage Background -->
  <rect width="800" height="600" rx="16" fill="url(#bgGrad)" />

  <!-- Luminous Atmospheric Orb -->
  <circle cx="400" cy="270" r="180" fill="url(#orbGrad)" />

  <!-- Precision Technical Framing Grid -->
  <g stroke="#334155" stroke-width="1" stroke-dasharray="4,6" opacity="0.4">
    <line x1="80" y1="80" x2="720" y2="80" />
    <line x1="80" y1="520" x2="720" y2="520" />
    <line x1="80" y1="80" x2="80" y2="520" />
    <line x1="720" y1="80" x2="720" y2="520" />
    <line x1="400" y1="60" x2="400" y2="540" />
  </g>

  <!-- Central Kinetic Rings -->
  <circle cx="400" cy="270" r="130" fill="none" stroke="url(#glowGrad)" stroke-width="2.5" opacity="0.85" />
  <circle cx="400" cy="270" r="100" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="6,4" opacity="0.6" />
  <circle cx="400" cy="270" r="70" fill="none" stroke="#c084fc" stroke-width="1.8" opacity="0.7" />

  <!-- Geometric Polygon Core -->
  <polygon points="400,195 465,232 465,308 400,345 335,308 335,232" fill="#1e1b4b" stroke="url(#glowGrad)" stroke-width="2.5" />
  <polygon points="400,225 435,245 435,295 400,315 365,295 365,245" fill="none" stroke="#38bdf8" stroke-width="1.5" />

  <!-- Glowing Focal Core Point -->
  <circle cx="400" cy="270" r="10" fill="#ffffff" filter="url(#neonGlow)" />

  <!-- Editorial Typography & Metric Labels -->
  <text x="400" y="430" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="600" fill="#f8fafc" letter-spacing="2">VECTOR PRECISION ENGINE</text>
  <text x="400" y="460" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="400" fill="#94a3b8" letter-spacing="1.2">DIRECT2D NATIVE SVG • INFINITE FIDELITY</text>

  <!-- Bottom Technical Badges -->
  <rect x="290" y="485" width="220" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <circle cx="308" cy="498" r="4" fill="#38bdf8" />
  <text x="322" y="502" font-family="'Consolas', monospace" font-size="11" fill="#cbd5e1">VIEWBOX 800 × 600 • 60 FPS</text>
</svg>
